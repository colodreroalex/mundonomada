<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Mundo Nómada · Moda y complementos</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Mundo Nómada: moda femenina y complementos desde Baena (Córdoba). Pedidos a toda España.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f1eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141010" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="alternate icon" href="img/logo.jpg">
    <link rel="apple-touch-icon" href="img/logo.jpg">

    <!-- Tema claro/oscuro antes del primer pintado para evitar parpadeos.
         Usa la elección guardada con el botón sol/luna o, si no hay, la del
         dispositivo. Bootstrap 5.3 y los tokens de styles.css leen data-bs-theme. -->
    <script>
      (function () {
        var consulta = window.matchMedia('(prefers-color-scheme: dark)');
        var aplicar = function () {
          var elegido = null;
          try { elegido = localStorage.getItem('mn-tema'); } catch (e) {}
          var tema = elegido === 'dark' || elegido === 'light' ? elegido : (consulta.matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-bs-theme', tema);
        };
        aplicar();
        if (consulta.addEventListener) { consulta.addEventListener('change', aplicar); }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>

  <body>
    <app-root></app-root>
    <script src="runtime-config.js"></script>
  </body>
</html>
