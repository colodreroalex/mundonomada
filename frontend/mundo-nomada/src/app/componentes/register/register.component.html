<div class="auth-pagina">
  <div class="auth-tarjeta">
    <div class="auth-cabecera">
      <span class="auth-logo" aria-hidden="true"></span>
      <h1 class="auth-titulo">Crea una cuenta</h1>
      <p class="auth-subtitulo">Únete a la comunidad de Mundo Nómada</p>
    </div>

    <!-- Bloque de notificación -->
    <div *ngIf="notification" class="notification-banner alert alert-{{ notification.type }} fade-in-out" role="alert">
      <i class="bi" [ngClass]="{
        'bi-check-circle-fill': notification.type === 'success',
        'bi-exclamation-triangle-fill': notification.type === 'warning',
        'bi-x-circle-fill': notification.type === 'danger'
      }"></i>
      {{ notification.message }}
    </div>

    <form (ngSubmit)="register()" class="auth-form">
      <div class="campo-icono">
        <label for="name" class="form-label">Nombre</label>
        <div class="campo-icono-control">
          <i class="bi bi-person" aria-hidden="true"></i>
          <input
            type="text"
            [(ngModel)]="name"
            name="name"
            id="name"
            class="form-control"
            placeholder="Tu nombre"
            autocomplete="name"
            required>
        </div>
      </div>

      <div class="campo-icono">
        <label for="email" class="form-label">Email</label>
        <div class="campo-icono-control">
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            id="email"
            class="form-control"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            inputmode="email"
            required>
        </div>
      </div>

      <div class="campo-icono">
        <label for="password" class="form-label">Contraseña</label>
        <div class="campo-icono-control">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            id="password"
            class="form-control con-boton"
            placeholder="Crea una contraseña segura"
            autocomplete="new-password"
            required>
          <button type="button" class="ver-password" (click)="mostrarPassword = !mostrarPassword"
                  [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-custom btn-lg w-100">Registrarse</button>
    </form>

    <div class="auth-alternativa">
      <p>¿Ya tienes una cuenta?</p>
      <a routerLink="/login">Iniciar sesión <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
    </div>
  </div>
</div>
