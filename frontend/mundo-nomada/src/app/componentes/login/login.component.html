<div class="auth-pagina">
  <div class="auth-tarjeta">
    <div class="auth-cabecera">
      <span class="auth-logo" aria-hidden="true"></span>
      <h1 class="auth-titulo">Acceso a tu cuenta</h1>
      <p class="auth-subtitulo">Bienvenido de nuevo a Mundo Nómada</p>
    </div>

    <form (ngSubmit)="login()" class="auth-form">
      <div class="campo-icono">
        <label for="email" class="form-label">Email</label>
        <div class="campo-icono-control">
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            id="email"
            class="form-control"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            inputmode="email"
            required>
        </div>
      </div>

      <div class="campo-icono">
        <label for="password" class="form-label">Contraseña</label>
        <div class="campo-icono-control">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            id="password"
            class="form-control con-boton"
            placeholder="Contraseña"
            autocomplete="current-password"
            required>
          <button type="button" class="ver-password" (click)="mostrarPassword = !mostrarPassword"
                  [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Checkbox para "Remember Me" -->
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="rememberMe"
          [(ngModel)]="rememberMe"
          name="rememberMe">
        <label class="form-check-label" for="rememberMe">Recordar contraseña</label>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="alert alert-danger mb-0" role="alert">
        <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>{{ errorMessage }}
      </div>

      <button type="submit" class="btn-custom btn-lg w-100">Iniciar Sesión</button>
    </form>

    <div class="auth-alternativa">
      <p>¿No estás registrado?</p>
      <a routerLink="/register">Regístrate aquí <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
    </div>
  </div>
</div>
