<div class="container admin-pagina">
  <a class="admin-volver" [routerLink]="['/lista-usuarios']"><i class="bi bi-arrow-left" aria-hidden="true"></i>Gestión de Usuarios</a>

  <div class="admin-cabecera">
    <div>
      <p class="cabecera-pagina-etiqueta">Usuarios</p>
      <h1>Crear Nuevo Usuario</h1>
    </div>
  </div>

  <div *ngIf="success" class="alert alert-success admin-aviso">
    <i class="fas fa-check-circle" aria-hidden="true"></i><span>{{ success }}</span>
  </div>

  <div *ngIf="error" class="alert alert-danger admin-aviso">
    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
    <div>
      {{ error }}
      <div class="mt-2">
        <button type="button" class="btn-custom btn-sm" (click)="retry()">
          <i class="fas fa-sync-alt" aria-hidden="true"></i> Reintentar
        </button>
      </div>
    </div>
  </div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="panel-superficie admin-formulario">
    <div class="admin-campos">
      <div>
        <label for="name" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="name" formControlName="name" autocomplete="off"
              [ngClass]="{'is-invalid': userForm.get('name')?.invalid && userForm.get('name')?.touched}">
        <div *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched" class="invalid-feedback">
          <span *ngIf="userForm.get('name')?.errors?.['required']">El nombre es obligatorio</span>
          <span *ngIf="userForm.get('name')?.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</span>
        </div>
      </div>

      <div>
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" formControlName="email" autocomplete="off" inputmode="email"
              [ngClass]="{'is-invalid': userForm.get('email')?.invalid && userForm.get('email')?.touched}">
        <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="invalid-feedback">
          <span *ngIf="userForm.get('email')?.errors?.['required']">El email es obligatorio</span>
          <span *ngIf="userForm.get('email')?.errors?.['email']">Introduce un email válido</span>
        </div>
      </div>

      <div>
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" formControlName="password" autocomplete="new-password"
              [ngClass]="{'is-invalid': userForm.get('password')?.invalid && userForm.get('password')?.touched}">
        <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" class="invalid-feedback">
          <span *ngIf="userForm.get('password')?.errors?.['required']">La contraseña es obligatoria</span>
          <span *ngIf="userForm.get('password')?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres</span>
        </div>
      </div>

      <div>
        <label for="role" class="form-label">Rol</label>
        <select class="form-select" id="role" formControlName="role"
              [ngClass]="{'is-invalid': userForm.get('role')?.invalid && userForm.get('role')?.touched}">
          <option value="user">Usuario</option>
          <option value="admin">Administrador</option>
        </select>
        <div *ngIf="userForm.get('role')?.invalid && userForm.get('role')?.touched" class="invalid-feedback">
          <span *ngIf="userForm.get('role')?.errors?.['required']">El rol es obligatorio</span>
        </div>
      </div>
    </div>

    <div class="admin-botones">
      <button type="button" class="btn-secundario" [routerLink]="['/lista-usuarios']">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver
      </button>
      <button type="submit" class="btn-custom" [disabled]="loading" [ngClass]="{'disabled': userForm.invalid && !loading}">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <i *ngIf="!loading" class="fas fa-save" aria-hidden="true"></i> Crear Usuario
      </button>
    </div>
  </form>
</div>
