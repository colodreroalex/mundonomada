<div class="container admin-pagina">
  <a class="admin-volver" [routerLink]="['/lista-usuarios']"><i class="bi bi-arrow-left" aria-hidden="true"></i>Gestión de Usuarios</a>

  <div class="admin-cabecera">
    <div>
      <p class="cabecera-pagina-etiqueta">Usuarios</p>
      <h1>Eliminar Usuario</h1>
    </div>
  </div>

  <div *ngIf="loadingData" class="text-center py-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2 text-muted">Cargando datos del usuario...</p>
  </div>

  <div *ngIf="success" class="alert alert-success admin-aviso">
    <i class="fas fa-check-circle" aria-hidden="true"></i><span>{{ success }}</span>
  </div>

  <div *ngIf="error" class="alert alert-danger admin-aviso">
    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
    <div>
      {{ error }}
      <div class="mt-2">
        <button type="button" class="btn-custom btn-sm" (click)="retry()">
          <i class="fas fa-sync-alt" aria-hidden="true"></i> Reintentar
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="!loadingData && !error && user" class="panel-superficie confirmacion">
    <div class="confirmacion-icono"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i></div>
    <h2>¿Estás seguro?</h2>
    <p>Estás a punto de eliminar al usuario <strong>{{ user.name }}</strong> con email <strong>{{ user.email }}</strong>.</p>
    <p class="aviso-irreversible">Esta acción no se puede deshacer.</p>

    <div class="confirmacion-botones">
      <button type="button" class="btn-secundario" (click)="cancelDelete()">
        <i class="fas fa-times" aria-hidden="true"></i> Cancelar
      </button>
      <button type="button" class="btn-peligro lleno" [disabled]="loading" (click)="confirmDelete()">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <i *ngIf="!loading" class="fas fa-trash-alt" aria-hidden="true"></i> Eliminar Usuario
      </button>
    </div>
  </div>
</div>
