<div class="container admin-pagina">
  <a class="admin-volver" routerLink="/adminPanel"><i class="bi bi-arrow-left" aria-hidden="true"></i>Admin Panel</a>

  <div class="admin-cabecera">
    <div>
      <p class="cabecera-pagina-etiqueta">Productos</p>
      <h1>Eliminar Productos</h1>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros panel-superficie">
    <label class="campo-icono-control">
      <i class="bi bi-search" aria-hidden="true"></i>
      <span class="visually-hidden">Buscar por nombre</span>
      <input type="search" class="form-control" placeholder="Buscar por nombre..."
             [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()">
    </label>
    <label class="campo-icono-control">
      <i class="bi bi-filter" aria-hidden="true"></i>
      <span class="visually-hidden">Filtrar por categoría</span>
      <select class="form-select con-icono" [(ngModel)]="selectedCategoryId" (change)="onCategoryChange()">
        <option [ngValue]="null">Todas las categorías</option>
        <option *ngFor="let categoria of categorias" [ngValue]="categoria.CategoriaID">
          {{ categoria.Nombre }}
        </option>
      </select>
    </label>
    <button type="button" class="btn-secundario" (click)="clearFilters()">
      <i class="bi bi-x-circle" aria-hidden="true"></i> Limpiar filtros
    </button>
  </div>

  <!-- Indicador de carga -->
  <div *ngIf="loading" class="d-flex justify-content-center my-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success" role="alert">{{ success }}</div>

  <!-- Productos -->
  <div *ngIf="filteredProducts && filteredProducts.length > 0; else noProducts" class="admin-rejilla">
    <article class="admin-item producto-item" *ngFor="let producto of filteredProducts">
      <div class="producto-item-imagen">
        <img *ngIf="producto.imagen" [src]="producto.imagen" alt="{{ producto.nombre }}" loading="lazy">
      </div>
      <h3>{{ producto.nombre }}</h3>
      <p>{{ producto.descripcion }}</p>
      <strong class="producto-item-precio">{{ producto.precio | currency:'EUR' }}</strong>
      <div class="admin-item-acciones">
        <button type="button" class="btn-peligro w-100" (click)="deleteProduct(producto)">
          <i class="bi bi-trash3" aria-hidden="true"></i> Eliminar
        </button>
      </div>
    </article>
  </div>

  <ng-template #noProducts>
    <div class="alert alert-warning" role="alert" *ngIf="!loading">
      <span *ngIf="products.length === 0">No hay productos disponibles.</span>
      <span *ngIf="products.length > 0 && filteredProducts.length === 0">No se encontraron productos con los filtros seleccionados.</span>
    </div>
  </ng-template>
</div>
