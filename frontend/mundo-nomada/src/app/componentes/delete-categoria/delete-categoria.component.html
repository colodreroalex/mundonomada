<div class="container admin-pagina">
  <a class="admin-volver" routerLink="/adminPanel"><i class="bi bi-arrow-left" aria-hidden="true"></i>Admin Panel</a>

  <div class="admin-cabecera">
    <div>
      <p class="cabecera-pagina-etiqueta">Categorías</p>
      <h1>Eliminar Categorías</h1>
    </div>
  </div>

  <!-- Indicador de carga -->
  <div *ngIf="loading" class="d-flex justify-content-center my-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success" role="alert">{{ success }}</div>

  <!-- Categorías -->
  <div *ngIf="categorias && categorias.length > 0; else noCategorias" class="admin-rejilla">
    <article class="admin-item" *ngFor="let categoria of categorias">
      <h3>{{ categoria.Nombre }}</h3>
      <p>{{ categoria.Descripcion }}</p>
      <div class="admin-item-acciones">
        <button type="button" class="btn-peligro w-100" (click)="deleteCategoria(categoria)">
          <i class="bi bi-trash3" aria-hidden="true"></i> Eliminar
        </button>
      </div>
    </article>
  </div>

  <ng-template #noCategorias>
    <div class="alert alert-warning" role="alert" *ngIf="!loading">
      No hay categorías disponibles.
    </div>
  </ng-template>
</div>
