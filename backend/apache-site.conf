ServerTokens Prod
ServerSignature Off
TraceEnable Off
<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api_php(?:/|$)
        RewriteCond %{REQUEST_FILENAME} !-f
        # /main is both an Angular route and an asset directory. Only real
        # files bypass the SPA; otherwise mod_dir redirects /main to HTTP.
        RewriteRule ^ /index.html [END]
    </Directory>
    <Directory /var/www/html/api_php>
        # Solo GET, POST y OPTIONS; peticiones de como máximo 4 MB (una imagen
        # de producto de 1,5 MB ocupa unos 2 MB en base64)
        <LimitExcept GET POST OPTIONS>
            Require all denied
        </LimitExcept>
        LimitRequestBody 4194304
        Header always set Cache-Control "no-store"
    </Directory>
    <Directory /var/www/html/api_php/config>
        Require all denied
    </Directory>
    # Archivos internos que solo se incluyen desde otros PHP
    <FilesMatch "^(conexion_postgres|seguridad(_carrito)?|stripe|validacion_producto|catalogo)\.php$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # HSTS solo cuando el proxy de Render indica que la petición llegó por HTTPS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
    # CSP: scripts solo propios; estilos y fuentes de Google Fonts, jsDelivr y cdnjs;
    # imágenes propias, en base64 o https; llamadas a la API propia y a EmailJS;
    # el mapa de Google en Contacto. El pago de Stripe es una redirección, no un script.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.emailjs.com; frame-src https://www.google.com; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

    <FilesMatch "^(index\.html|runtime-config\.js|tema-inicial\.js)$">
        Header set Cache-Control "no-store"
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
